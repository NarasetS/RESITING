# Default RESITING assumptions used by the new-user tooling.
# Copy config/scenarios/base.yaml to make scenario-specific overrides.

scenario:
  name: base
  description: Baseline RESITING assumptions

assumptions:
  si_threshold: 0
  coarsen_scale: 2

capacity_density:
  wind_mw_per_km2: 4.5
  solar_mw_per_km2: 15.0

plant_size:
  wind_mw: 50.0
  solar_mw: 10.0
  biomass_area_km2: 100.0
  bgec_area_km2: 100.0
  msw_area_km2: 100.0

weights:
  source: empirical
  file: weightfactors/empirical_weights.json

farm_area:
  wind_min_km2: 4.0
  solar_min_km2: 0.4

exclusions:
  existing_committed_buffer_m: 2900

solver:
  name: highs
  mip_abs_gap: 0.1
  mip_rel_gap: 0.1
  enforce_total_quota: true
  enforce_regional_quota: true

output:
  input_final_si:
  investment_run_name:

quotas:
  wind:
    R0: 0
    R10: 1900
    R11: 1200
    R12: 800
    R2: 6600
    R3: 600
    R4: 1400
  solar:
    R0: 100
    R10: 1600
    R11: 700
    R12: 1900
    R2: 1600
    R3: 900
    R4: 2600
  biomass:
    R0: 0
    R10: 0
    R11: 0
    R12: 0
    R2: 0
    R3: 0
    R4: 0
  bgec:
    R0: 0
    R10: 0
    R11: 0
    R12: 0
    R2: 0
    R3: 0
    R4: 0
  msw:
    R0: 0
    R10: 0
    R11: 0
    R12: 0
    R2: 0
    R3: 0
    R4: 0
